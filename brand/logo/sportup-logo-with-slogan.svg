<?xml version="1.0" encoding="UTF-8"?>
<!--
  SportUp + slogan "Good Idea Sport Slovakia"
  Sub-slogan národnej značky Slovenskej republiky pre oblasť športu (MZV SR, 2016).
  Slogan font: Poppins Bold Italic, modrá #388FC3.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 360" role="img" aria-label="SportUp — Good Idea Sport Slovakia">
  <title>SportUp — Good Idea Sport Slovakia</title>

  <!-- Logo -->
  <rect x="6" y="20" width="720" height="205" rx="102" ry="102" fill="#1A2D47"/>
  <text x="60" y="180"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900" font-style="italic" font-size="178" letter-spacing="-4"
        fill="#FFFFFF">Sport</text>
  <text x="660" y="200"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900" font-style="italic" font-size="232" letter-spacing="-6"
        fill="#388FC3">UP</text>

  <!-- Slogan -->
  <text x="512" y="320"
        font-family="'Poppins', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-style="italic" font-size="42" letter-spacing="0.5"
        text-anchor="middle"
        fill="#388FC3">Good Idea Sport Slovakia</text>
</svg>
