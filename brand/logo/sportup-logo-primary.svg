<?xml version="1.0" encoding="UTF-8"?>
<!--
  SportUp — primárne logo (plnofarebná verzia, svetlé pozadie)
  Pomer strán: 4.18 : 1 (1024 × 245 px)
  Farby: Navy #1A2D47, Blue #388FC3, White #FFFFFF
  Font logotypu: Helvetica Neue Black Italic (weight 900) — pre produkčné použitie
                 odporúčame previesť na krivky (Inkscape: Path → Object to Path).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 245" role="img" aria-label="SportUp — Good Idea Sport Slovakia">
  <title>SportUp</title>
  <desc>Logo SportUp — Good Idea Sport Slovakia. Národná značka Slovenskej republiky pre oblasť športu.</desc>

  <!-- Navy blok — stadium tvar so zaoblenými rohmi -->
  <rect x="6" y="20" width="720" height="205" rx="102" ry="102" fill="#1A2D47"/>

  <!-- "Sport" — biely text vyrezaný z navy bloku -->
  <text x="60" y="180"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="178"
        letter-spacing="-4"
        fill="#FFFFFF">Sport</text>

  <!-- "UP" — modrý text presahujúci pravý okraj bloku -->
  <text x="660" y="200"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="232"
        letter-spacing="-6"
        fill="#388FC3">UP</text>
</svg>
