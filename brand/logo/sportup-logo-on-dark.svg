<?xml version="1.0" encoding="UTF-8"?>
<!--
  SportUp — plnofarebná verzia pre tmavé pozadie
  Použitie: na tmavých pozadiach (navy, čierne fotografie). Biely blok, navy "Sport", modrý "UP".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 245" role="img" aria-label="SportUp">
  <title>SportUp — verzia pre tmavé pozadie</title>

  <!-- Biely blok -->
  <rect x="6" y="20" width="720" height="205" rx="102" ry="102" fill="#FFFFFF"/>

  <!-- "Sport" — navy -->
  <text x="60" y="180"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="178"
        letter-spacing="-4"
        fill="#1A2D47">Sport</text>

  <!-- "UP" — modrá -->
  <text x="660" y="200"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="232"
        letter-spacing="-6"
        fill="#388FC3">UP</text>
</svg>
