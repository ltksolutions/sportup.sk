<?xml version="1.0" encoding="UTF-8"?>
<!--
  SportUp — navy monochromatická verzia
  Použitie: na svetlých pozadiach pri jednofarebnej tlači, faxe, gravírovaní.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 245" role="img" aria-label="SportUp">
  <title>SportUp — navy verzia</title>

  <!-- Navy obrys bloku -->
  <rect x="6" y="20" width="720" height="205" rx="102" ry="102" fill="none" stroke="#1A2D47" stroke-width="10"/>

  <!-- "Sport" — navy -->
  <text x="60" y="180"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="178"
        letter-spacing="-4"
        fill="#1A2D47">Sport</text>

  <!-- "UP" — navy -->
  <text x="660" y="200"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="232"
        letter-spacing="-6"
        fill="#1A2D47">UP</text>
</svg>
