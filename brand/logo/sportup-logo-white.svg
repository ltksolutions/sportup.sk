<?xml version="1.0" encoding="UTF-8"?>
<!--
  SportUp — biela monochromatická verzia
  Použitie: na fotografiách, farebných pozadiach, kde nie je možné použiť plnofarebnú verziu.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 245" role="img" aria-label="SportUp">
  <title>SportUp — biela verzia</title>

  <!-- Biely blok s tenkým bielym obrysom (pre čistú siluetu) -->
  <rect x="6" y="20" width="720" height="205" rx="102" ry="102" fill="none" stroke="#FFFFFF" stroke-width="10"/>

  <!-- "Sport" — biela -->
  <text x="60" y="180"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="178"
        letter-spacing="-4"
        fill="#FFFFFF">Sport</text>

  <!-- "UP" — biela -->
  <text x="660" y="200"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="232"
        letter-spacing="-6"
        fill="#FFFFFF">UP</text>
</svg>
