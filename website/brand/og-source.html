<!--
  SportUp.sk — šablóna Open Graph obrázkov (1200×630)

  Obrázky og-*.png vo website/ sa generujú skriptom
    python3 marketing/social/tools/og_images.py
  ktorý túto šablónu vyplní textami jednotlivých stránok a odfotí ju
  v Chrome (Playwright). Texty stránok sú v skripte, nie tu.

  Logo: brand/logo/SportUp-dark-mountain.svg (variant pre tmavé pozadie,
  rovnaký ako v hlavičke webu). Hory sú len v logu, nie v pozadí.

  Bezpečná zóna pre obsah: top 75px / sides 80px / bottom 95px
  — zachováva čitateľnosť pri 1.91:1 cropovaní (Facebook, LinkedIn).
-->
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /*LOCAL_FONTS*/
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif;
    background: #1A2D47;
    color: #fff;
    position: relative;
    padding: 75px 80px 95px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .accent-line {
    position: absolute;
    top: 0;
    left: 80px;
    width: 60px;
    height: 8px;
    background: #388FC3;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #388FC3;
    margin-bottom: 24px;
  }
  .title {
    font-weight: 700;
    font-size: 60px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    margin-bottom: 24px;
    max-width: 980px;
  }
  .title em {
    font-style: italic;
    font-weight: 700;
    color: #6BB3DD;
  }
  .lead {
    font-weight: 400;
    font-size: 24px;
    line-height: 1.4;
    color: rgba(255,255,255,0.8);
    max-width: 900px;
    margin-bottom: 32px;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .logo { height: 64px; width: auto; display: block; }
  .meta-line {
    font-weight: 600;
    font-style: italic;
    font-size: 22px;
    color: rgba(255,255,255,0.82);
  }
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div>
    <div class="eyebrow">{eyebrow}</div>
    <h1 class="title">{title}</h1>
    <p class="lead">{lead}</p>
  </div>

  <div class="footer">
    <img class="logo" src="logo/SportUp-dark-mountain.svg" alt="SportUp">
    <div class="meta-line">Good Idea Sport Slovakia</div>
  </div>
</body>
</html>
