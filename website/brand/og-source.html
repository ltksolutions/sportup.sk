<!--
  SportUp.sk — Open Graph image source (1200×630)

  Tento súbor sa používa na generovanie /og-image.png pomocou Chrome headless.
  Pri zmene textu alebo layoutu spusti:

    /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
      --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 \
      --screenshot=og-image.png \
      'file:///absolutna/cesta/k/og-source.html'

  Vyžaduje lokálne nainštalovanú font Helvetica Neue Black Italic
  (zvyšok fontov sa stiahne z Google Fonts pri renderovaní).

  Bezpečná zóna pre obsah: top 75px / sides 80px / bottom 95px
  — zachováva čitateľnosť pri 1.91:1 cropovaní (Facebook, LinkedIn).
-->
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Helvetica Neue Black Italic';
    src: local('Helvetica Neue Black Italic');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Poppins', sans-serif;
    background: #1A2D47;
    color: #fff;
    position: relative;
    padding: 75px 80px 95px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  /* mountain motif top-right */
  .mountain {
    position: absolute;
    top: 0;
    right: 0;
    width: 520px;
    height: 100%;
    opacity: 0.08;
  }
  .accent-line {
    position: absolute;
    top: 0;
    left: 80px;
    width: 60px;
    height: 8px;
    background: #388FC3;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #388FC3;
    margin-bottom: 24px;
  }
  .title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 68px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    margin-bottom: 24px;
    max-width: 900px;
  }
  .title em {
    font-style: italic;
    font-weight: 700;
    color: #6BB3DD;
  }
  .lead {
    font-family: 'Poppins', sans-serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.4;
    color: rgba(255,255,255,0.78);
    max-width: 820px;
    margin-bottom: 36px;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .logo {
    font-family: 'Helvetica Neue Black Italic', 'Poppins', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .logo .sport { color: #fff; }
  .logo .up { color: #388FC3; }
  .logo .tld {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    font-weight: 500;
    font-size: 24px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0;
    margin-left: 4px;
    vertical-align: 16px;
  }
  .meta {
    text-align: right;
  }
  .meta-line {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-style: italic;
    font-size: 22px;
    color: rgba(255,255,255,0.82);
  }
</style>
</head>
<body>
  <svg class="mountain" viewBox="0 0 520 630" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMaxYMid slice">
    <polygon points="0,630 180,200 280,330 380,120 520,400 520,630" fill="#388FC3"/>
    <polygon points="100,630 280,330 380,450 520,250 520,630" fill="#fff"/>
  </svg>
  <div class="accent-line"></div>

  <div>
    <div class="eyebrow">SportUp.sk · Národný register</div>
    <h1 class="title">Otvorené riešenie pre <em>slovenský šport</em> a podporu cestovného ruchu</h1>
    <p class="lead">Jednotný národný register osôb, organizácií, aktivít a športovísk — postavený na otvorenej architektúre s otvorenými zdrojovými kódmi.</p>
  </div>

  <div class="footer">
    <div class="logo"><span class="sport">Sport</span><span class="up">UP</span><span class="tld">.sk</span></div>
    <div class="meta">
      <div class="meta-line">Good Idea Sport Slovakia</div>
    </div>
  </div>
</body>
</html>
