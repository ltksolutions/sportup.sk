<?xml version="1.0" encoding="UTF-8"?>
<!--
  SportUp — SU ikona (favicon, social avatar, app ikona)
  Zaoblený navy štvorec, biele "S" + modré "U".
  Geometria: 512×512 viewBox s ~64 px paddingom.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SportUp">
  <title>SportUp — SU ikona</title>

  <!-- Navy zaokrúhlený štvorec -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#1A2D47"/>

  <!-- "S" — biela -->
  <text x="100" y="358"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="280"
        letter-spacing="-8"
        fill="#FFFFFF">S</text>

  <!-- "U" — modrá -->
  <text x="265" y="358"
        font-family="'Helvetica Neue', 'Helvetica', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="280"
        letter-spacing="-8"
        fill="#388FC3">U</text>
</svg>
